  <text x="240" y="217" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">ID UNIDAD</text>
  <text x="330" y="217" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">ESTADO</text>
  <text x="430" y="217" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">ZONA / GPS</text>
  <text x="540" y="217" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">BATERÍA</text>
  <text x="640" y="217" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">ACCIONES</text>

  <!-- Row 1 -->
  <text x="240" y="255" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12">SC-1049-CC</text>
  <rect x="330" y="242" width="70" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="365" y="256" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Disponible</text>
  <text x="430" y="255" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Plaza Mayor</text>
  <rect x="540" y="248" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="248" width="46" height="6" rx="3" fill="#10B981"/>
  <text x="600" y="255" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">92%</text>
  <rect x="640" y="240" width="75" height="22" rx="4" fill="url(#blueAccent)"/>
  <text x="677" y="255" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Alquilar</text>

  <!-- Row 2 -->
  <line x1="230" y1="275" x2="730" y2="275" stroke="rgba(255,255,255,0.04)"/>
  <text x="240" y="300" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12">SC-1052-CC</text>
  <rect x="330" y="287" width="70" height="20" rx="10" fill="rgba(59, 130, 246, 0.15)"/>
  <text x="365" y="301" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">En Ruta</text>
  <text x="430" y="300" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Av. de España</text>
  <rect x="540" y="293" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="293" width="37" height="6" rx="3" fill="#3B82F6"/>
  <text x="600" y="300" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">74%</text>
  <rect x="640" y="285" width="75" height="22" rx="4" fill="#334155"/>
  <text x="677" y="300" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Seguimiento</text>

