  <text x="240" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">TOTAL PATINETES</text>
  <text x="240" y="148" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">128</text>
  <text x="240" y="165" fill="#10B981" font-family="'Inter', sans-serif" font-size="10">94 en servicio activo</text>

  <rect x="400" y="90" width="165" height="85" rx="10" fill="url(#cardJava)" stroke="rgba(255,255,255,0.06)"/>
  <text x="420" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">ALQUILERES HOY</text>
  <text x="420" y="148" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">342</text>
  <text x="420" y="165" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="10">+18% vs semana ant.</text>

  <rect x="580" y="90" width="160" height="85" rx="10" fill="url(#cardJava)" stroke="rgba(255,255,255,0.06)"/>
  <text x="600" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">BATERÍA MEDIA</text>
  <text x="600" y="148" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">82%</text>
  <text x="600" y="165" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">3 unidades en carga</text>

