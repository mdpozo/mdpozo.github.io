<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="cardJava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F242C"/>
      <stop offset="100%" stop-color="#14181F"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgJava)"/>

  <!-- Desktop Window Header -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#1C2128" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="65" cy="50" r="5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="5" fill="#10B981"/>
  <text x="400" y="55" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">EcoScoot Management Suite · JavaFX 21 (MVC + DAO)</text>

  <!-- Sidebar -->
  <rect x="40" y="70" width="160" height="390" fill="#14181F" stroke="rgba(255,255,255,0.05)"/>
  <text x="60" y="110" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">MENÚ PRINCIPAL</text>
  
  <!-- Active menu item -->
  <rect x="50" y="125" width="140" height="34" rx="6" fill="rgba(59, 130, 246, 0.15)"/>
  <text x="75" y="147" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Flota Activa</text>
  
  <text x="75" y="185" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Estadísticas</text>
  <text x="75" y="220" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Clientes</text>
  <text x="75" y="255" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Facturación</text>
  <text x="75" y="290" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Configuración</text>

