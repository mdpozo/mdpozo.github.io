  <line x1="230" y1="320" x2="730" y2="320" stroke="rgba(255,255,255,0.04)"/>
  <text x="240" y="345" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12">SC-1088-CC</text>
  <rect x="330" y="332" width="70" height="20" rx="10" fill="rgba(245, 158, 11, 0.15)"/>
  <text x="365" y="346" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Taller / Rev</text>
  <text x="430" y="345" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Base Central</text>
  <rect x="540" y="338" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="338" width="12" height="6" rx="3" fill="#EF4444"/>
  <text x="600" y="345" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">24%</text>
  <rect x="640" y="330" width="75" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="677" y="345" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Inspeccionar</text>

  <!-- Row 4 -->
  <line x1="230" y1="365" x2="730" y2="365" stroke="rgba(255,255,255,0.04)"/>
  <text x="240" y="390" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12">SC-1094-CC</text>
  <rect x="330" y="377" width="70" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="365" y="391" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Disponible</text>
  <text x="430" y="390" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">Campus UEX</text>
  <rect x="540" y="383" width="50" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="383" width="49" height="6" rx="3" fill="#10B981"/>
  <text x="600" y="390" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">98%</text>
  <rect x="640" y="375" width="75" height="22" rx="4" fill="url(#blueAccent)"/>
  <text x="677" y="390" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Alquilar</text>
</svg>
