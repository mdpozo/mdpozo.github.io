  <rect x="90" y="525" width="1020" height="2" fill="rgba(255,255,255,0.08)"/>
  <text x="90" y="565" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="16">
    🌐 mdpozo.github.io  |  GitHub: @mdpozo  |  Cáceres, España
