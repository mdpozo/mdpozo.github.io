<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGremio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <linearGradient id="cardGremio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2232" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101724" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGremio)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Glow spheres in background -->
  <circle cx="680" cy="120" r="140" fill="#00F2FE" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="380" r="120" fill="#FFD700" opacity="0.05" filter="url(#glow)"/>

  <!-- Header Bar Mockup -->
  <rect x="50" y="40" width="700" height="60" rx="12" fill="url(#cardGremio)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="85" cy="70" r="16" fill="url(#cyanGrad)"/>
  <path d="M80 70l4 4 7-8" stroke="#0B0D14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="115" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17">QUESTFIT · TABLÓN DE MISIONES</text>
  <rect x="560" y="55" width="80" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="#00F2FE" stroke-width="1"/>
  <text x="600" y="75" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">LVL 24</text>
  <rect x="650" y="55" width="85" height="30" rx="15" fill="rgba(255, 215, 0, 0.12)" stroke="#FFD700" stroke-width="1"/>
  <text x="692" y="75" fill="#FFD700" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">1,420 XP</text>

  <!-- Left Card: RPG Stats & Radar Simulation -->
  <rect x="50" y="120" width="310" height="330" rx="14" fill="url(#cardGremio)" stroke="rgba(255,255,255,0.08)"/>
  <text x="75" y="155" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">ATRIBUTOS DEL PERSONAJE</text>
  
  <!-- Radar polygon mockup -->
  <g transform="translate(205, 260)">
    <!-- Polygons -->
    <polygon points="0,-80 76,-25 47,65 -47,65 -76,-25" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <polygon points="0,-50 48,-15 30,40 -30,40 -48,-15" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <polygon points="0,-65 60,-20 38,55 -40,30 -60,-10" fill="url(#cyanGrad)" fill-opacity="0.25" stroke="#00F2FE" stroke-width="2"/>
    <!-- Points -->
    <circle cx="0" cy="-65" r="4" fill="#00F2FE"/>
    <circle cx="60" cy="-20" r="4" fill="#00F2FE"/>
    <circle cx="38" cy="55" r="4" fill="#00F2FE"/>
    <circle cx="-40" cy="30" r="4" fill="#00F2FE"/>
    <circle cx="-60" cy="-10" r="4" fill="#00F2FE"/>
    <!-- Labels -->
    <text x="0" y="-90" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">FUERZA</text>
    <text x="90" y="-20" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="start">CARDIO</text>
    <text x="50" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">AGILIDAD</text>
    <text x="-50" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">CORE</text>
    <text x="-90" y="-20" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">CONSTANCIA</text>
  </g>

  <!-- Progress bar on bottom of left card -->
  <rect x="75" y="415" width="260" height="8" rx="4" fill="#1F293D"/>
  <rect x="75" y="415" width="195" height="8" rx="4" fill="url(#cyanGrad)"/>

  <!-- Right Cards: Quest Activity -->
  <!-- Quest Card 1 -->
  <rect x="380" y="120" width="370" height="95" rx="12" fill="url(#cardGremio)" stroke="rgba(0, 242, 254, 0.25)"/>
  <circle cx="415" cy="167" r="18" fill="rgba(0, 242, 254, 0.15)"/>
  <path d="M410 167h10M415 162v10" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>
  <text x="445" y="157" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Sesión de Calistenia: Push &amp; Pull</text>
  <text x="445" y="177" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">4 series · Dominadas &amp; Fondos · Racha 12 días</text>
  <rect x="665" y="152" width="65" height="26" rx="6" fill="rgba(0, 242, 254, 0.12)"/>
  <text x="697" y="169" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">+150 XP</text>

  <!-- Quest Card 2 -->
  <rect x="380" y="230" width="370" height="95" rx="12" fill="url(#cardGremio)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="415" cy="277" r="18" fill="rgba(255, 215, 0, 0.15)"/>
  <path d="M415 270l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="#FFD700"/>
  <text x="445" y="267" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">Ruta HIIT Sprint 5K</text>
  <text x="445" y="287" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Ritmo 4:30 min/km · Desafío semanal completado</text>
  <rect x="665" y="262" width="65" height="26" rx="6" fill="rgba(255, 215, 0, 0.12)"/>
  <text x="697" y="279" fill="#FFD700" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">+300 XP</text>

  <!-- Quest Card 3 (Live Mode Active) -->
  <rect x="380" y="340" width="370" height="110" rx="12" fill="url(#cardGremio)" stroke="rgba(16, 185, 129, 0.3)"/>
  <circle cx="400" cy="365" r="5" fill="#10B981" filter="url(#glow)"/>
  <text x="415" y="370" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MODO LIVE WORKOUT · ACTIVO</text>
  <text x="400" y="405" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700">00:42:18</text>
  <rect x="630" y="380" width="100" height="38" rx="8" fill="#10B981"/>
  <text x="680" y="404" fill="#0B0D14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">PAUSAR</text>
</svg>
